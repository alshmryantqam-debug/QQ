<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NOVA Router Manager Enterprise v5.0 - إدارة مايكروتك حقيقية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Orbitron:wght@600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>/* ==========================================================================
   NOVA ROUTER MANAGER v2.0 - CYBERPUNK NEON UI & 3D PORTAL TRANSITIONS
   ========================================================================== */
:root {
  --bg-deep: #020510;
  --phone-bg: #04091a;
  --card-bg: rgba(8, 18, 42, 0.82);
  --card-bg-dark: rgba(5, 11, 28, 0.92);
  --cyan: #00e5ff;
  --cyan-soft: #26c6da;
  --blue-neon: #0077ff;
  --purple-neon: #b026ff;
  --magenta-neon: #d500f9;
  --green-neon: #00e676;
  --amber-neon: #ff9100;
  --red-neon: #ff2a54;
  --text-white: #f4f8ff;
  --text-dim: #8da4c8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background: radial-gradient(circle at 50% 15%, #0a1c42 0%, #030716 55%, #01030a 100%);
  color: var(--text-white);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Top Quick Portal Jump Bar (Desktop helper, hidden in fullscreen mobile) */
.portal-hud-bar {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: rgba(6, 15, 36, 0.88);
  border: 1px solid rgba(0, 229, 255, 0.35);
  box-shadow: 0 0 25px rgba(0, 229, 255, 0.18), inset 0 0 12px rgba(0, 229, 255, 0.08);
  backdrop-filter: blur(12px);
  padding: 7px 14px;
  border-radius: 999px;
  margin: 10px 10px 12px;
  z-index: 100;
  flex-wrap: wrap;
}

.hud-pill {
  background: rgba(12, 26, 58, 0.85);
  color: #b9d2f4;
  border: 1px solid rgba(0, 229, 255, 0.25);
  padding: 5px 13px;
  border-radius: 999px;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.hud-pill.active, .hud-pill:hover {
  background: linear-gradient(135deg, #00c6ff 0%, #0066ff 100%);
  color: #fff;
  border-color: #7df9ff;
  box-shadow: 0 0 14px rgba(0, 198, 255, 0.7);
  transform: translateY(-1px);
}

/* App Viewport Container (Single Real Phone App Experience) */
.app-device-shell {
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  border-radius: 0;
  border: none;
  margin: 0;
  background: radial-gradient(circle at 50% 18%, #0a1f4e 0%, #050d24 48%, #030714 100%);
  border-radius: 46px;
  border: 2.5px solid rgba(58, 128, 225, 0.6);
  box-shadow:
    0 0 0 4px #020611,
    0 0 0 6px rgba(30, 75, 150, 0.4),
    0 25px 65px rgba(0, 0, 0, 0.9),
    0 0 45px rgba(0, 160, 255, 0.26),
    inset 0 0 30px rgba(0, 195, 255, 0.15);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  direction: ltr;
  perspective: 1200px;
  margin-bottom: 16px;
}

@media (max-width: 440px) {
  .portal-hud-bar {
    display: none;
  }
  .app-device-shell {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    border: none;
    margin-bottom: 0;
    box-shadow: none;
  }
}

/* Cosmic Starfield & Ambient Glow */
.app-device-shell::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 18% 12%, rgba(0, 229, 255, 0.75) 50%, transparent 100%),
    radial-gradient(1px 1px at 82% 24%, rgba(0, 229, 255, 0.65) 50%, transparent 100%),
    radial-gradient(2px 2px at 35% 68%, rgba(176, 38, 255, 0.5) 50%, transparent 100%),
    radial-gradient(1.5px 1.5px at 72% 84%, rgba(0, 229, 255, 0.55) 50%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}

/* Neon Portal Flash Effect during Transitions */
.portal-warp-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.32) 0%, rgba(176, 38, 255, 0.15) 45%, transparent 75%);
  opacity: 0;
  pointer-events: none;
  z-index: 90;
  transition: opacity 0.35s ease;
}

.portal-warp-flash.active {
  opacity: 1;
}

/* iOS Status Bar (Persistent at top of device) */
.status-bar {
  position: relative;
  z-index: 50;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px 6px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.status-icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ==========================================================================
   PORTAL PAGES SYSTEM & 3D ANIMATED TRANSITIONS
   ========================================================================== */
.portals-stage {
  position: relative;
  flex: 1;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 10;
}

.portal-page {
  position: absolute;
  inset: 0;
  padding: 4px 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  opacity: 0;
  pointer-events: none;
  transform: translate3d(42px, 0, -60px) rotateY(-8deg) scale(0.94);
  filter: blur(6px);
  transition:
    transform 0.46s cubic-bezier(0.16, 1, 0.3, 1),
    opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1),
    filter 0.38s ease;
  will-change: transform, opacity, filter;
  overflow-y: auto;
  overflow-x: hidden;
}

.portal-page::-webkit-scrollbar {
  width: 0px;
}

.portal-page.active {
  opacity: 1;
  pointer-events: auto;
  transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
  filter: blur(0px);
  z-index: 20;
}

.portal-page.exit-left {
  opacity: 0;
  pointer-events: none;
  transform: translate3d(-42px, 0, -60px) rotateY(8deg) scale(0.94);
  filter: blur(6px);
}

/* Sub-Portal Overlay Modal (For 12 Tools, Add Subscriber, QR Generator, etc.) */
.sub-portal-modal {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 10%, rgba(12, 32, 78, 0.98) 0%, rgba(4, 9, 26, 0.99) 70%);
  backdrop-filter: blur(18px);
  z-index: 80;
  padding: 44px 16px 16px;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transform: translateY(35px) scale(0.93);
  filter: blur(8px);
  transition:
    transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
    opacity 0.34s ease,
    filter 0.34s ease;
}

.sub-portal-modal.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
  filter: blur(0);
}

.sub-portal-body {
  flex: 1;
  overflow-y: auto;
  padding-right: 2px;
  direction: rtl;
}

.sub-portal-body::-webkit-scrollbar {
  width: 3px;
}
.sub-portal-body::-webkit-scrollbar-thumb {
  background: rgba(0, 229, 255, 0.4);
  border-radius: 99px;
}

/* Common App Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 8px;
  position: relative;
  flex-shrink: 0;
}

.header-title {
  font-size: 19px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 0 12px rgba(0, 229, 255, 0.38);
  letter-spacing: 0.2px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--cyan);
  filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8));
  transition: all 0.2s ease;
  background: rgba(0, 229, 255, 0.05);
  border: 1px solid rgba(0, 229, 255, 0.18);
}

.icon-btn:hover {
  transform: scale(1.08);
  background: rgba(0, 229, 255, 0.15);
  border-color: var(--cyan);
}

.icon-btn:active {
  transform: scale(0.95);
}

/* ==========================================================================
   SCREEN 1: الرئيسية (HOME DASHBOARD)
   ========================================================================== */
.nova-main-title {
  text-align: center;
  line-height: 1.05;
}

.nova-word {
  font-family: 'Orbitron', sans-serif;
  font-size: 31px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(180deg, #7df9ff 0%, #00d2ff 55%, #0077ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.65));
}

.nova-sub {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  color: #d8e8ff;
  letter-spacing: 0.6px;
  margin-top: 1px;
}

.connected-pill-wrap {
  display: flex;
  justify-content: center;
  margin: 2px 0 4px;
}

.connected-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 15px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(6, 48, 36, 0.88) 0%, rgba(12, 75, 48, 0.92) 50%, rgba(6, 48, 36, 0.88) 100%);
  border: 1.3px solid rgba(0, 230, 118, 0.8);
  box-shadow: 0 0 16px rgba(0, 230, 118, 0.45), inset 0 0 8px rgba(0, 230, 118, 0.25);
  color: #eafff2;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.connected-pill:hover {
  transform: scale(1.04);
}

.router-hero-stage {
  position: relative;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
  cursor: pointer;
}

.metrics-row-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 9px;
}

.metric-card {
  background: linear-gradient(180deg, rgba(12, 24, 54, 0.84) 0%, rgba(6, 13, 32, 0.94) 100%);
  border-radius: 15px;
  padding: 8px 4px 7px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.metric-card:hover {
  transform: translateY(-2px);
}

.metric-card.cyan {
  border: 1.4px solid rgba(0, 229, 255, 0.75);
  box-shadow: 0 0 14px rgba(0, 229, 255, 0.28), inset 0 0 10px rgba(0, 229, 255, 0.12);
}
.metric-card.purple {
  border: 1.4px solid rgba(186, 68, 255, 0.75);
  box-shadow: 0 0 14px rgba(186, 68, 255, 0.28), inset 0 0 10px rgba(186, 68, 255, 0.12);
}
.metric-card.red {
  border: 1.4px solid rgba(255, 64, 96, 0.75);
  box-shadow: 0 0 14px rgba(255, 64, 96, 0.28), inset 0 0 10px rgba(255, 64, 96, 0.12);
}
.metric-card.green {
  border: 1.4px solid rgba(118, 255, 3, 0.65);
  box-shadow: 0 0 14px rgba(118, 255, 3, 0.22), inset 0 0 10px rgba(118, 255, 3, 0.1);
}

.metric-label {
  font-size: 11.5px;
  color: #b8cde8;
  font-weight: 700;
  margin-top: 2px;
}

.metric-val {
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: #ffffff;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
}

.traffic-now-card {
  background: linear-gradient(180deg, rgba(10, 23, 56, 0.86) 0%, rgba(5, 12, 32, 0.95) 100%);
  border: 1.5px solid rgba(0, 195, 255, 0.68);
  box-shadow: 0 0 18px rgba(0, 162, 255, 0.25), inset 0 0 14px rgba(0, 195, 255, 0.1);
  border-radius: 18px;
  padding: 8px 12px 0;
  margin-bottom: 9px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.2s ease;
}

.traffic-now-card:hover {
  border-color: #7df9ff;
}

.traffic-title {
  text-align: center;
  font-size: 13.5px;
  font-weight: 700;
  color: #e4f1ff;
  margin-bottom: 3px;
}

.traffic-speeds {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 8px;
  margin-bottom: 2px;
}

.speed-big {
  display: flex;
  align-items: baseline;
  gap: 5px;
  font-family: 'Inter', sans-serif;
}

.speed-big .num-green {
  font-size: 21px;
  font-weight: 800;
  color: #32ff7e;
  text-shadow: 0 0 10px rgba(50, 255, 126, 0.55);
}

.speed-big .num-cyan {
  font-size: 21px;
  font-weight: 800;
  color: #18ffff;
  text-shadow: 0 0 10px rgba(24, 255, 255, 0.55);
}

.speed-big .unit {
  font-size: 13px;
  font-weight: 700;
  color: #8ab4f8;
}

.providers-row-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 9px;
}

.provider-card {
  background: linear-gradient(180deg, rgba(11, 24, 54, 0.86) 0%, rgba(6, 13, 31, 0.94) 100%);
  border: 1.2px solid rgba(0, 200, 255, 0.48);
  box-shadow: 0 0 12px rgba(0, 180, 255, 0.16), inset 0 0 8px rgba(0, 200, 255, 0.08);
  border-radius: 14px;
  padding: 7px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.provider-card:hover {
  transform: translateY(-2px);
  border-color: var(--cyan);
}

.prov-top {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 800;
  color: #ffffff;
}

.prov-status {
  font-size: 12px;
  font-weight: 800;
  color: #00e676;
  text-shadow: 0 0 8px rgba(0, 230, 118, 0.45);
}

.prov-speed {
  font-family: 'Inter', sans-serif;
  font-size: 11.5px;
  font-weight: 700;
  color: #d0e4ff;
}

/* Persistent Bottom Navigation Bar */
.bottom-nav {
  margin-top: auto;
  background: linear-gradient(180deg, rgba(10, 22, 52, 0.94) 0%, rgba(5, 11, 28, 0.98) 100%);
  border: 1.3px solid rgba(0, 210, 255, 0.45);
  box-shadow: 0 -4px 18px rgba(0, 170, 255, 0.18), inset 0 1px 8px rgba(0, 229, 255, 0.15);
  border-radius: 22px;
  padding: 7px 8px 6px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-items: center;
  flex-shrink: 0;
}

.bottom-nav.four-cols {
  grid-template-columns: repeat(4, 1fr);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  color: #8da4c8;
  font-size: 10.5px;
  font-weight: 700;
  position: relative;
  padding: 2px 0;
  transition: all 0.2s ease;
  text-decoration: none;
}

.nav-item.active {
  color: #ffffff;
  text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
}

.nav-item.active svg {
  color: var(--cyan);
  filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.95));
}

.nav-item.active::after {
  content: "";
  position: absolute;
  bottom: -5px;
  width: 30px;
  height: 3px;
  border-radius: 99px;
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan), 0 0 18px var(--cyan);
}

/* ==========================================================================
   SCREEN 2: خريطة الشبكة (NETWORK MAP)
   ========================================================================== */
.topology-stage {
  position: relative;
  height: 445px;
  width: 100%;
  margin: 0 0 6px;
}

.topo-node-group {
  cursor: pointer;
  transition: filter 0.2s ease;
}

.topo-node-group:hover {
  filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.95));
}

.net-health-card {
  background: linear-gradient(180deg, rgba(6, 34, 46, 0.86) 0%, rgba(4, 18, 30, 0.95) 100%);
  border: 1.5px solid rgba(0, 230, 160, 0.65);
  box-shadow: 0 0 18px rgba(0, 230, 160, 0.22), inset 0 0 12px rgba(0, 230, 160, 0.12);
  border-radius: 18px;
  padding: 9px 14px 0;
  margin-bottom: 10px;
  overflow: hidden;
  cursor: pointer;
}

.net-health-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}

.excellent-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 800;
  color: #00e676;
  text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
}

.dual-buttons-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 8px;
}

.btn-glass-dark {
  background: linear-gradient(180deg, rgba(12, 26, 56, 0.88) 0%, rgba(7, 15, 34, 0.96) 100%);
  border: 1.4px solid rgba(0, 195, 255, 0.48);
  box-shadow: 0 0 12px rgba(0, 195, 255, 0.15);
  color: #ffffff;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 700;
  padding: 9px 12px;
  border-radius: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}

.btn-neon-blue {
  background: linear-gradient(90deg, #00c6ff 0%, #0066ff 100%);
  border: 1.4px solid #80e5ff;
  box-shadow: 0 0 18px rgba(0, 162, 255, 0.65), inset 0 0 8px rgba(255, 255, 255, 0.35);
  color: #ffffff;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 800;
  padding: 9px 12px;
  border-radius: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.2s;
}

.btn-neon-blue:hover, .btn-glass-dark:hover {
  transform: translateY(-2px);
  filter: brightness(1.12);
}

/* ==========================================================================
   SCREEN 3: إدارة المشتركين (SUBSCRIBERS MANAGEMENT)
   ========================================================================== */
.search-box {
  background: rgba(7, 16, 38, 0.9);
  border: 1.4px solid rgba(0, 210, 255, 0.55);
  box-shadow: 0 0 14px rgba(0, 195, 255, 0.2), inset 0 0 8px rgba(0, 195, 255, 0.08);
  border-radius: 999px;
  padding: 7px 15px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 10px;
}

.search-input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  text-align: right;
  width: 100%;
  direction: rtl;
}

.search-input::placeholder {
  color: #8da4c8;
}

.sub-stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.sub-stat-card {
  background: linear-gradient(180deg, rgba(10, 20, 44, 0.88) 0%, rgba(5, 11, 26, 0.95) 100%);
  border-radius: 15px;
  padding: 8px 4px 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.sub-stat-card:hover {
  transform: translateY(-2px);
}

.sub-stat-card.green {
  border: 1.4px solid rgba(0, 230, 118, 0.75);
  box-shadow: 0 0 14px rgba(0, 230, 118, 0.25), inset 0 0 10px rgba(0, 230, 118, 0.12);
}
.sub-stat-card.amber {
  border: 1.4px solid rgba(255, 152, 0, 0.75);
  box-shadow: 0 0 14px rgba(255, 152, 0, 0.25), inset 0 0 10px rgba(255, 152, 0, 0.12);
}
.sub-stat-card.red {
  border: 1.4px solid rgba(255, 42, 84, 0.75);
  box-shadow: 0 0 14px rgba(255, 42, 84, 0.25), inset 0 0 10px rgba(255, 42, 84, 0.12);
}
.sub-stat-card.purple {
  border: 1.4px solid rgba(176, 38, 255, 0.75);
  box-shadow: 0 0 14px rgba(176, 38, 255, 0.25), inset 0 0 10px rgba(176, 38, 255, 0.12);
}

.sub-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  max-height: 310px;
  overflow-y: auto;
}

.sub-list::-webkit-scrollbar {
  width: 0px;
}

.sub-item-card {
  background: linear-gradient(90deg, rgba(10, 22, 52, 0.88) 0%, rgba(7, 16, 38, 0.94) 100%);
  border: 1.2px solid rgba(0, 195, 255, 0.42);
  box-shadow: 0 0 12px rgba(0, 150, 255, 0.15);
  border-radius: 15px;
