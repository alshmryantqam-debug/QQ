name: Build NOVA Router Manager APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Scaffolding
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.nova.routermanager --project-name nova_router_manager --platforms=android .
          mv pubspec.yaml.bak pubspec.yaml

      - name: Configure Android Permissions (Internet & Cleartext Traffic for MikroTik)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi
          sed -i 's/android:label="nova_router_manager"/android:label="NOVA Router Manager"/g' "$MANIFEST"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK (Split & Universal)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK for Easy Download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk NOVA-Router-Manager-Pro.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Router-Manager-Pro-APK
          path: NOVA-Router-Manager-Pro.apk
          retention-days: 90

      - name: Publish APK to GitHub Releases (on push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "NOVA Router Manager Pro v3.0 (Build #${{ github.run_number }})"
          body: |
            ### ⚡ تطبيق NOVA Router Manager Pro - نسخة أندرويد جاهزة للتثبيت
            - مطابق 100% للتصميم الأصلي بجميع الشاشات والبوابات الفرعية.
            - يدعم الاتصال الحقيقي المباشر براوتر **MikroTik (RouterOS v6 / v7)** عبر بروتوكول **API Port 8728** و **REST API**.
            - قم بتحميل ملف `NOVA-Router-Manager-Pro.apk` بالأسفل وتثبيته مباشرة على هاتفك.
          files: NOVA-Router-Manager-Pro.apk
